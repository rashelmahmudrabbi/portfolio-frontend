<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 – Page Not Found | Rashel Mahmud Rabbi</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root { --navy: #0b1e3d; --gold: #c8952a; --gold-lt: #e8b84b; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, var(--navy) 0%, #10284f 60%, #1a3a6e 100%);
      color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    .container { max-width: 520px; }
    .code {
      font-family: 'Crimson Pro', serif; font-size: clamp(5rem, 15vw, 8rem);
      font-weight: 700; color: var(--gold-lt); line-height: 1;
      text-shadow: 0 4px 30px rgba(200,149,42,.25);
      margin-bottom: .5rem;
    }
    h1 {
      font-family: 'Crimson Pro', serif; font-size: 1.6rem; font-weight: 700;
      margin-bottom: 1rem;
    }
    p { color: rgba(255,255,255,.65); font-size: .95rem; line-height: 1.6; margin-bottom: 2rem; }
    .btn-home {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .65rem 1.8rem; border-radius: 25px; font-size: .9rem;
      font-weight: 600; text-decoration: none; transition: all .25s;
      border: 2px solid var(--gold); background: var(--gold); color: var(--navy);
    }
    .btn-home:hover {
      background: var(--gold-lt); border-color: var(--gold-lt);
      box-shadow: 0 4px 20px rgba(200,149,42,.4);
    }
    .pattern {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .container { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div class="pattern"></div>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a href="/portfolio-frontend/" class="btn-home">
      ← Back to Portfolio
    </a>
  </div>
</body>
</html>
